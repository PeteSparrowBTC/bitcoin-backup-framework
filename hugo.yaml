# Hugo configuration for the published guide.
#
# The site is built from the markdown already in this repository. Nothing under
# content/ is committed: scripts/build-site.sh generates it from README.md and
# START-HERE.md so there is only ever one copy of any sentence.
#
# Chosen for one binary and no package manager, which is the standard the tools
# in this set are held to. See docs/superpowers/plans/2026-08-09-one-guide.md.

# Published to GitHub Pages under the repository name. A custom domain would
# change this line and add a CNAME; deliberately not done yet.
baseURL: https://petesparrowbtc.github.io/bitcoin-backup-framework/
title: Bitcoin Backup Framework
locale: en-gb
enableRobotsTXT: true

# Hextra ships as a Hugo module, so the build needs Go as well as Hugo extended.
module:
  imports:
    - path: github.com/imfing/hextra

# Every page is emitted as markdown beside its HTML, which is what the page
# context menu copies and links to. Without this the menu renders with nothing
# behind it.
outputs:
  home: [html, rss, markdown]
  page: [html, markdown]
  section: [html, rss, markdown]

markup:
  goldmark:
    renderer:
      # The framework's ASCII architecture diagram and its tables need raw HTML
      # to survive rendering intact.
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Start here
      pageRef: /
      weight: 1
    - name: The framework
      pageRef: /framework
      weight: 2
    - name: Tools
      weight: 3
      params:
        type: separator
    - name: dice-to-seed
      url: https://github.com/PeteSparrowBTC/dice-to-seed
      weight: 4
    - name: slip39-backup
      url: https://github.com/PeteSparrowBTC/slip39-backup
      weight: 5
    # One-on-one work, pointed at the booking section of petesparrow.com rather
    # than at Cal.com directly, so the offer can be rewritten there without
    # touching this repository.
    #
    # Rendered as a solid orange button by assets/css/custom.css, which hooks it
    # by href because Hextra gives menu entries no class of their own. It is the
    # last item, so it reads as an offer rather than as another section of the
    # guide, and the guide never depends on it: everything here is free to
    # follow alone and says so.
    - name: Book a free intro call
      url: https://petesparrow.com/#book
      weight: 10

params:
  # Full width throughout. The framework carries wide tables (the locations
  # table in section 8, the failure matrix in section 10) that were being
  # squeezed into a column narrower than the screen.
  #
  # `page.width` governs the outer container; the reading column has its own cap
  # of 72rem which assets/css/custom.css lifts, otherwise the setting moves the
  # sidebars outward and leaves the text where it was.
  page:
    width: full
    # The page context menu. The theme's version is a copy-as-markdown control
    # with assistants bolted on underneath; layouts/_partials/components/
    # page-context-menu.html reverses that, because the assistants are the
    # point here and the markdown buttons were not worth the space.
    #
    # The FIRST entry is the button. The rest are the dropdown. Reorder this
    # list to change which assistant is the default; nothing in the template
    # names a vendor.
    #
    # Readers arrive at a long security document with questions it does not
    # answer for their situation, and asking an assistant is what they are going
    # to do anyway. Handing over the whole page beats a half-remembered summary.
    #
    # This does not weaken the no-external-requests promise. Every entry is an
    # ordinary link: nothing is fetched, nothing is told that you opened the
    # page, and scripts/check-no-external-requests.sh ignores <a href> for that
    # reason while still failing on anything the browser would load by itself.
    #
    # The prompts are ours rather than the theme's default, and they end by
    # telling the assistant not to ask for secrets. Everything on this site is
    # public and costs nothing to share. A reader's seed words, shares and
    # payload file are not, and no question about this guide needs them.
    contextMenu:
      enable: true
      links:
        - name: Open in ChatGPT
          icon: chatgpt
          url: "https://chatgpt.com/?hints=search&q=I%27m+reading+this+bitcoin+backup+guide%3A+{url}%0AHelp+me+understand+it+and+pressure-test+whether+it+fits+my+situation.+Do+not+ask+me+for+my+seed+words%2C+my+SLIP-39+shares+or+my+payload+file%2C+and+I+will+not+paste+them."
        - name: Open in Claude
          icon: claude
          url: "https://claude.ai/new?q=I%27m+reading+this+bitcoin+backup+guide%3A+{url}%0AHelp+me+understand+it+and+pressure-test+whether+it+fits+my+situation.+Do+not+ask+me+for+my+seed+words%2C+my+SLIP-39+shares+or+my+payload+file%2C+and+I+will+not+paste+them."
        # Gemini has no way to receive a prompt from a link. gemini.google.com
        # ignores ?q= and ?prompt= (those work only through a browser extension),
        # and AI Studio declined the same request, so both would open an empty
        # chat with no idea what the reader was looking at: a button that appears
        # to work and does nothing, which is the failure mode this whole document
        # is written against.
        #
        # Google AI Mode is the one surface of theirs that takes a query, and it
        # is Gemini answering. The prompt is shorter than the other two because
        # this one travels as a search query rather than as a chat message.
        - name: Open in Gemini
          icon: gemini
          url: "https://www.google.com/search?udm=50&q=Read+this+bitcoin+backup+guide+and+explain+it+to+me%3A+{url}"
    # "Suggest a change", beside the assistants at the top of every page.
    #
    # It opens the issue form in .github/ISSUE_TEMPLATE/page-feedback.yml with
    # the page already filled in. template-url.html url-encodes {url}, which is
    # what a query parameter needs, and `page` is the id of the form's first
    # field, which is how GitHub prefills it.
    #
    # An issue rather than an edit link, for two reasons. The pages here are
    # generated, so "edit this page" would open content/ which is gitignored and
    # does not exist in the repository; pointing it at the right source file
    # would still ask the reader to work out which of four documents a section
    # came from. And most objections are not a diff. Someone who thinks the
    # 2-of-3 default is wrong for their situation has something worth hearing
    # and no line to change.
    #
    # It sits outside the assistant dropdown deliberately. Asking a machine
    # about the page and telling a person the page is wrong are different acts,
    # and the second one has to be visible without opening a menu that was
    # opened for the first.
    suggestChange:
      enable: true
      name: Suggest a change
      icon: pencil-alt
      url: "https://github.com/PeteSparrowBTC/bitcoin-backup-framework/issues/new?template=page-feedback.yml&page={url}"
  navbar:
    width: full
    displayTitle: true
    displayLogo: false
  footer:
    width: full
    displayCopyright: false
    displayPoweredBy: false
  theme:
    # Follows the reader's system setting, with a toggle.
    default: system
    displayToggle: true
  # No comment system, no analytics, no external anything. The build guard in
  # scripts/build-site.sh fails the build if an external request appears in the
  # output, so this promise is checked rather than remembered.
  editURL:
    enable: false
