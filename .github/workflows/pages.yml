# Builds the guide and publishes it to GitHub Pages.
#
# Two jobs on purpose. `build` runs on pull requests as well as on main, so a
# change that would break the site or leak an external request fails in review
# rather than after publishing. `deploy` runs only on main.
#
# The site is generated from README.md and START-HERE.md by
# scripts/build-site.sh. Nothing under content/ is committed.

name: Pages

on:
  push:
    branches: [main]
  pull_request:
  # Lets a publish be triggered by hand, e.g. the first one.
  workflow_dispatch:

# Read-only by default; the deploy job widens this for itself alone.
permissions:
  contents: read

# Let a running publish finish rather than cancelling it half-uploaded, but
# collapse queued ones: only the newest commit is worth publishing.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pinned rather than "latest" so a Hugo release cannot change the output
  # without a commit that says so.
  HUGO_VERSION: 0.164.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Hextra ships as a Hugo module, so the build needs Go to fetch it.
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Hugo extended
        run: |
          curl -sSLo hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version

      # Proves the leak check can still fail before trusting it on real output.
      # Its first version could not, so this runs every time.
      - name: Test the external-request check
        run: bash scripts/test-no-external-requests.sh

      # Generates content/, builds, and runs the leak check on the result.
      - name: Build
        run: bash scripts/build-site.sh

      # Only the default branch produces something to publish.
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository on first run, so publishing needs
          # no click in Settings.
          enablement: true

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    # Publishing is a separate job so the token that can write to Pages is not
    # held while third-party module code is being fetched and run.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
