# Builds the guide and publishes it to GitHub Pages.
#
# Two jobs on purpose. `build` runs on pull requests as well as on main, so a
# change that would break the site or leak an external request fails in review
# rather than after publishing. `deploy` runs only on main.
#
# The site is generated from README.md and START-HERE.md by
# scripts/build-site.sh. Nothing under content/ is committed.

name: Pages

on:
  push:
    branches: [main]
  pull_request:
  # Lets a publish be triggered by hand, e.g. the first one.
  workflow_dispatch:

# Read-only by default; the deploy job widens this for itself alone.
permissions:
  contents: read

# Let a running publish finish rather than cancelling it half-uploaded, but
# collapse queued ones: only the newest commit is worth publishing.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pinned rather than "latest" so a Hugo release cannot change the output
  # without a commit that says so.
  HUGO_VERSION: 0.164.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Hextra ships as a Hugo module, so the build needs Go to fetch it.
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # Retried, and checked against the published checksums.
      #
      # The retry is not defensive programming for its own sake. This one step
      # failed three different ways in a single day on a repository nobody was
      # attacking: an intercepted TLS handshake (curl 60), a died connection
      # (curl 56), and an empty reply (curl 52). Each is transient, each was
      # fatal without a retry, and each left main published from the previous
      # commit while the newest one silently never shipped.
      #
      # The checksum answers a different question from the retry. The retry
      # decides whether the file arrived; the checksum decides whether what
      # arrived is what Hugo published. A guide whose first instruction to the
      # reader is to verify what they download should not skip that in its own
      # build, and the cost is one extra fetch.
      #
      # --retry-delay is deliberately NOT set. curl backs off exponentially on its
      # own (1s, 2s, 4s, 8s...) and setting a fixed delay switches that off. The
      # first version of this step set 2 seconds, so five retries covered ten
      # seconds, and on 2026-08-12 GitHub's release host answered 503 for longer
      # than that and the build failed anyway. --retry-max-time 180 bounds the
      # whole sequence instead, so a short outage is absorbed and a long one
      # still fails inside three minutes rather than hanging the job.
      #
      # --fail earns its place. Without it curl treats an HTTP error page as a
      # successful transfer: it writes the error body to the output file and
      # exits 0, and the build dies several steps later with dpkg reporting
      # "not a Debian format archive". That is precisely what happened on
      # 2026-08-12, the fourth failure of this step in two days and the only one
      # a retry alone could not have helped with, because nothing had reported
      # an error yet. With --fail the HTTP status becomes a curl error, which
      # makes it both visible and retryable.
      #
      # Note what it is not. The checksums file travels from the same host as
      # the package it describes, so this catches a corrupted or truncated
      # download rather than a compromised release. That is the same limit the
      # guide states about its own tools, and it is worth having for the same
      # reason.
      - name: Install Hugo extended
        run: |
          set -euo pipefail

          fetch() {
            curl --silent --show-error --location --fail \
                 --retry 6 --retry-all-errors --retry-max-time 180 \
                 --connect-timeout 20 --max-time 300 \
                 --output "$1" "$2"
          }

          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"

          fetch "$deb" "$base/$deb"
          fetch checksums.txt "$base/hugo_${HUGO_VERSION}_checksums.txt"

          # Fixed-string match on the two-space separator sha256sum writes, so
          # the version's dots cannot act as wildcards and the _withdeploy_
          # variant cannot be picked by accident.
          grep -F "  $deb" checksums.txt > wanted.txt \
            || { echo "no checksum published for $deb" >&2; exit 1; }
          test "$(wc -l < wanted.txt)" -eq 1 \
            || { echo "expected exactly one checksum line for $deb" >&2; exit 1; }
          sha256sum -c wanted.txt

          sudo dpkg -i "$deb"
          hugo version

      # Proves the leak check can still fail before trusting it on real output.
      # Its first version could not, so this runs every time.
      - name: Test the external-request check
        run: bash scripts/test-no-external-requests.sh

      # Generates content/, builds, and runs the leak check on the result.
      - name: Build
        run: bash scripts/build-site.sh

      # Only the default branch produces something to publish.
      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    # Publishing is a separate job so the token that can write to Pages is not
    # held while third-party module code is being fetched and run.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # No `actions/configure-pages` step here, deliberately.
      #
      # It was used with `enablement: true` to switch Pages on automatically,
      # and that does not work: creating a Pages site that has never existed
      # needs repository admin, which GITHUB_TOKEN does not have at any
      # permission level. Both attempts failed with "Create Pages site failed:
      # Resource not accessible by integration", first from `build` and then
      # from `deploy` with `pages: write` granted.
      #
      # Pages is therefore enabled once by a human (see CLAUDE.md). After that
      # the step had nothing left to do, because its outputs are unused: the
      # site URL is pinned in hugo.yaml rather than read from it.
      - id: deployment
        uses: actions/deploy-pages@v4
